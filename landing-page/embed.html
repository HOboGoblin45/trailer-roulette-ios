<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trailer</title>
<!--
  YouTube embed proxy for Trailer Roulette iOS.

  Why this exists: WKWebView strips the HTTP Referer header from cross-
  origin requests to injected iframes (WebKit Bug 169846). YouTube's
  July 2025 embedder-identity update made that referer mandatory.
  Result: any iframe loaded directly inside our Capacitor app fails with
  "Error 153 Video player configuration error" regardless of scheme,
  origin, or playerVars.

  The fix is to proxy the embed through a real public-DNS https page.
  When the app loads `/embed?v=ID` in an iframe, the YouTube iframe
  inside *this* page sees a normal referrer (https://trailer-roulette.
  vercel.app) and accepts the embed. Vercel's `Referrer-Policy:
  strict-origin-when-cross-origin` (set in vercel.json) sends the
  origin without the path, which is what YouTube wants.

  Sources:
    https://dev.to/davidvesely/fixing-youtube-error-153-in-ios-capacitor-apps-a-simple-proxy-solution-607
    https://til.simonwillison.net/youtube/fixing-153-embed
    https://corsproxy.io/blog/fix-youtube-error-150-153-webview/

  Deployment: served at https://trailer-roulette.vercel.app/embed
  (Vercel's `cleanUrls: true` strips the .html extension automatically.)
-->
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  iframe {
    border: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .err {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 24px;
    text-align: center;
    color: #aaa;
    font-size: 14px;
  }
</style>
</head>
<body>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var v = params.get('v') || '';
  // YouTube IDs are 11 alphanumeric/-_ chars; be lenient (6–20) but reject
  // anything else so we don't pass crud to the embed URL.
  if (!/^[A-Za-z0-9_-]{6,20}$/.test(v)) {
    document.body.innerHTML = '<div class="err">Invalid or missing video id.</div>';
    return;
  }

  // Honor optional knobs from query string. The app passes them through
  // exactly as it would to the YouTube IFrame API.
  var autoplay = params.get('autoplay') === '0' ? '0' : '1';
  var mute = params.get('mute') === '1' ? '1' : '0';
  var controls = params.get('controls') === '0' ? '0' : '1';

  // Use youtube-nocookie domain — Apple-friendly, fewer trackers, often
  // succeeds when youtube.com fails for the exact same key.
  var src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v) +
            '?autoplay=' + autoplay +
            '&mute=' + mute +
            '&controls=' + controls +
            '&playsinline=1' +
            '&rel=0' +
            '&modestbranding=1';

  var iframe = document.createElement('iframe');
  iframe.src = src;
  iframe.title = 'Trailer';
  iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
  iframe.setAttribute('allowfullscreen', 'true');
  iframe.referrerPolicy = 'strict-origin-when-cross-origin';
  document.body.appendChild(iframe);
})();
</script>
</body>
</html>
